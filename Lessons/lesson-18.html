<!DOCTYPE html>
<html lang="en">
<head>
  <title>Progress Bar</title>
  <link rel="stylesheet" href="Bootstrap/css/bootstrap.css">
</head>
<body>
  <div class="progress">
    <div class="progress-bar bg-primary progress-bar-striped" style="width: 50%;">
      50%
    </div>
  </div>
    <br>
  <div class="progress">
    <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" style="width: 75%;">
      75%
    </div>
  </div>

  <script src="Bootstrap/js/popper.min.js"></script>
  <script src="Bootstrap/js/jquery-3.7.1.js"></script>
  <script src="Bootstrap/js/bootstrap.js"></script>
</body>
</html>
