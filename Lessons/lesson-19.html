<!DOCTYPE html>
<html lang="en">
<head>
  <title>Model</title>
  <link rel="stylesheet" href="../Bootstrap/css/bootstrap.css">
</head>
<body>

  <button type="button" class="btn btn-success btn-lg" data-toggle="modal" data-target="#x">
    Save
  </button>
  
  <!-- Modal -->
  <div class="modal fade" id="x" tabindex="-1" role="dialog" aria-labelledby="modelTitleId" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Save Element</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">
          Are you sure?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="button" class="btn btn-success">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Button trigger modal -->
  <button type="button" class="btn btn-danger btn-lg" data-toggle="modal" data-target="#modelId">
    Delete
  </button>
  
  <!-- Modal -->
  <div class="modal fade" id="modelId" tabindex="-1" role="dialog" aria-labelledby="modelTitleId" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Element</h5>
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">
          Are you sure?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="button" class="btn btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../Bootstrap/js/popper.min.js"></script>
  <script src="../Bootstrap/js/jquery-3.7.1.js"></script>
  <script src="../Bootstrap/js/bootstrap.js"></script>
</body>
</html>
