<!DOCTYPE html>
<html lang="en">
<head>
  <title>Button</title>
  <link rel="stylesheet" href="../Bootstrap/css/bootstrap.css">
</head>
<body>
  <button>click</button>
  <div class="btn btn-primary">click</div>
  <div class="btn btn-outline-primary">click</div>
  <div class="btn btn-success">click</div>
  <div class="btn btn-outline-success">click</div>
<!-- ====================================================== -->

  <!-- btn-group  -->
  <div class="btn-group">
    <div class="btn btn-secondary">1</div>
    <div class="btn btn-secondary">2</div>
    <div class="btn btn-secondary">3</div>
    <div class="btn btn-secondary">4</div>
    <div class="btn btn-secondary">5</div>
  </div>
<!-- ====================================================== -->

  <br> <hr>
  <div class="btn-toolbar">
    <div class="btn-group">
      <div class="btn btn-secondary">1</div>
      <div class="btn btn-secondary">2</div>
      <div class="btn btn-secondary">3</div>
      <div class="btn btn-secondary">4</div>
      <div class="btn btn-secondary">5</div>
    </div>
    <div class="btn-group">
      <div class="btn btn-secondary">6</div>
      <div class="btn btn-secondary">7</div>
      <div class="btn btn-secondary">8</div>
      <div class="btn btn-secondary">9</div>
      <div class="btn btn-secondary">10</div>
    </div>
  </div>
<!-- ====================================================== -->
  <br> <hr>
  <div class="btn-group btn-group-lg">
    <div class="btn btn-secondary">1</div>
    <div class="btn btn-secondary">2</div>
    <div class="btn btn-secondary">3</div>
    <div class="btn btn-secondary">4</div>
    <div class="btn btn-secondary">5</div>
  </div>
  <br> <hr>
  <div class="btn-group btn-group-md">
    <div class="btn btn-secondary">1</div>
    <div class="btn btn-secondary">2</div>
    <div class="btn btn-secondary">3</div>
    <div class="btn btn-secondary">4</div>
    <div class="btn btn-secondary">5</div>
  </div>
  <br> <hr>
  <div class="btn-group btn-group-sm">
    <div class="btn btn-secondary">1</div>
    <div class="btn btn-secondary">2</div>
    <div class="btn btn-secondary">3</div>
    <div class="btn btn-secondary">4</div>
    <div class="btn btn-secondary">5</div>
  </div>


  <script src="../Bootstrap/js/popper.min.js"></script>
  <script src="../Bootstrap/js/jquery-3.7.1.js"></script>
  <script src="../Bootstrap/js/bootstrap.js"></script>
</body>
</html>
