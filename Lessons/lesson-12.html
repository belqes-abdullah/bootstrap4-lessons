<!DOCTYPE html>
<html lang="en">
<head>
  <title>Collapse</title>
  <link rel="stylesheet" href="Bootstrap/css/bootstrap.css">
</head>
<body>
  
  <button data-target="#fff" class="btn btn-primary" data-toggle="collapse">
      info
  </button>
  <h1 class="collapse" id="fff">Lorem ipsum dolor sit amet.</h1>
  <!-- ================================================================= -->
  <br>
  <!-- ================================================================= -->
  <button href="#yyy" class="btn btn-secondary dropdown-toggle" data-toggle="collapse">
      info
  </button>
  <h1 class="collapse" id="yyy">bla bla bla</h1>

  <script src="Bootstrap/js/popper.min.js"></script>
  <script src="Bootstrap/js/jquery-3.7.1.js"></script>
  <script src="Bootstrap/js/bootstrap.js"></script>
</body>
</html>
