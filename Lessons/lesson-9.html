<!DOCTYPE html>
<html lang="en">
<head>
  <title>slides</title>
  <link rel="stylesheet" href="Bootstrap/css/bootstrap.css">
</head>
<body>
  <!-- 
  carousel

  container
  ol
  img
  next
  -->
  <div id="slide" class="carousel slide container w-75">

    <ol class="carousel-indicators">
      <li data-target="#slide" data-slide-to="0" class="active"></li>
      <li data-target="#slide" data-slide-to="1"></li>
      <li data-target="#slide" data-slide-to="2"></li>
    </ol>

    <div class="carousel-inner">

      <div class="carousel-item active"> 
        <img src="../assets/1.jpg" alt="" class="w-100">
      </div>

      <div class="carousel-item"> 
        <img src="../assets/2.jpg" alt="" class="w-100">
      </div>

      <div class="carousel-item"> 
        <img src="../assets/3.jpg" alt="" class="w-100">
      </div>

    </div>

    <a href="#slide" class="carousel-control-next" data-slide="next">
      <span class="carousel-control-next-icon"></span>
    </a>

    <a href="#slide" class="carousel-control-prev" data-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </a>

  </div>

  <script src="Bootstrap/js/popper.min.js"></script>
  <script src="Bootstrap/js/jquery-3.7.1.js"></script>
  <script src="Bootstrap/js/bootstrap.js"></script>
</body>
</html>
