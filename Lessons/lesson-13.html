<!DOCTYPE html>
<html lang="en">
<head>
  <title>forms</title>
  <link rel="stylesheet" href="Bootstrap/css/bootstrap.css">
</head>
<body>

  <div class="container w-50 mt5">
    <form action="">
      <div class="form-group">
        <label for="">email</label>
        <input type="email" class="form-control" placeholder="email">  
        <small class="form-text text-muted">enter your email</small>
      </div>
      <!-- ================================== -->
      <div class="form-group">
        <label for="">password</label>
        <input type="password" class="form-control" placeholder="password">    
      </div>
      <!-- =================================== -->
      <div class="form-check">
        <input type="checkbox" class="form-check-input">
        <!-- <label for="" class="form-check-label">check me out</label> -->
        <label for="" class="mb-0">check me out</label>
      </div>
      <!-- =================================== -->
      <div class="form-group">
        <select name="" id="" class="form-control"> select
          <option value="">1</option>
          <option value="">2</option>
          <option value="">3</option>
          <option value="">4</option>
        </select>
      </div>
      <!-- =================================== -->
      <button class="btn btn-primary">submit</button>
    </form>
  </div>
  
  <script src="Bootstrap/js/popper.min.js"></script>
  <script src="Bootstrap/js/jquery-3.7.1.js"></script>
  <script src="Bootstrap/js/bootstrap.js"></script>
</body>
</html>
